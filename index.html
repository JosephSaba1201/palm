async function fetchAll(sb, table, orderCol){
  const pageSize = 1000;
  let from = 0, all = [];
  while(true){
    let q = sb.from(table).select("*").range(from, from+pageSize-1);
    if(orderCol) q = q.order(orderCol);
    const {data, error} = await q;
    if(error) throw new Error(`${table}: ${error.message}`);
    all = all.concat(data);
    if(!data.length || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

const PAGOS_CAT_LABELS = {
  soft: "Soft (honorarios, proyecto, legal)",
  calidad: "Control de Calidad (laboratorio, topografía)",
  general: "Servicios Generales",
  t1: "Torre 1",
  compartido: "Compartido (Torres/Amenidades)",
  seguridad: "Vigilancia / Seguridad",
  amenidades: "Amenidades",
  t2: "Torre 2",
  t3: "Torre 3",
};
const PAGOS_CAT_ORDER_KEYS = ["soft","calidad","general","t1","compartido","seguridad","amenidades","t2","t3"];
const PRESUPUESTO_CAT_LABELS = {t1:"Torre 1", t2:"Torre 2", amenidades:"Amenidades", servicios:"Servicios Generales", t3:"Torre 3"};

function numOrNull(v){ return (v===null || v===undefined) ? null : Number(v); }

function buildPagosItems(rows){
  return rows.map(r=>({
    f: r.fecha, cat: r.categoria, op: r.operacion, b: r.beneficiario,
    sp: (!r.subpartida || r.subpartida==="0") ? "" : r.subpartida,
    im: Number(r.importe), co: r.concepto, sem: r.semana,
  }));
}
function buildPagosReal(items){
  const real = {};
  PAGOS_CAT_ORDER_KEYS.forEach(k=>{
    const catItems = items.filter(x=>x.cat===k);
    const provMap = {}, mesMap = {};
    let total = 0;
    catItems.forEach(x=>{
      total += x.im;
      if(!provMap[x.b]) provMap[x.b] = {n:x.b, s:0, c:0};
      provMap[x.b].s += x.im; provMap[x.b].c += 1;
      const ym = x.f ? x.f.slice(0,7) : null;
      if(ym) mesMap[ym] = (mesMap[ym]||0) + x.im;
    });
    real[k] = {
      label: PAGOS_CAT_LABELS[k],
      total, count: catItems.length,
      proveedores: Object.values(provMap).sort((a,b)=>b.s-a.s),
      meses: mesMap,
    };
  });
  return real;
}

function buildComisionesItems(rows){
  return rows.map(r=>({f:r.fecha, b:r.beneficiario, im:Number(r.importe), co:r.concepto}));
}
function buildComisionesVentas(items){
  const provMap = {};
  let total = 0;
  items.forEach(x=>{
    total += x.im;
    if(!provMap[x.b]) provMap[x.b] = {n:x.b, s:0, c:0};
    provMap[x.b].s += x.im; provMap[x.b].c += 1;
  });
  return { total, count: items.length, proveedores: Object.values(provMap).sort((a,b)=>b.s-a.s) };
}

const COMISIONES_DEPTO_RE = /DEPARTAMENTO\s+([A-Z0-9]+(?:\s*\([^)]*\))?)\s+(T\d)\s+(.*?)\s+A\s+\$([\d,'\.]+)/i;
function buildComisionesPorDepto(items){
  const unidades = {};
  const sinDepto = {total:0, count:0};
  items.forEach(x=>{
    const m = COMISIONES_DEPTO_RE.exec(x.co || "");
    if(!m){
      sinDepto.total += x.im; sinDepto.count += 1;
      return;
    }
    const depto = m[1], torre = m[2].toLowerCase(), comprador = m[3].trim();
    const precio = Number(m[4].replace(/'/g,"").replace(/,/g,""));
    const key = depto + "|" + torre;
    if(!unidades[key]) unidades[key] = {depto, torre, comprador, precio, pagos:[], total:0};
    unidades[key].pagos.push({b:x.b, im:x.im, f:x.f});
    unidades[key].total += x.im;
  });
  sinDepto.total = Math.round(sinDepto.total*100)/100;
  const unidadesList = Object.values(unidades);
  unidadesList.forEach(u=>{ u.total = Math.round(u.total*100)/100; });
  return { unidades: unidadesList, sinDepto };
}

function buildVentasReal(rows){
  return rows.map(r=>({
    t:r.torre, md:r.modulo, niv:r.nivel, u:r.unidad,
    m2i:numOrNull(r.m2_interior), ter:numOrNull(r.terraza), m2:numOrNull(r.m2_total),
    cli:r.cliente, f:r.fecha_contrato, s:r.status, ase:r.asesor,
    pv:numOrNull(r.precio_venta), pc:numOrNull(r.pagado_a_cuenta), sd:numOrNull(r.saldo),
  }));
}
function buildInventarioReal(rows){
  return rows.map(row=>({
    t:row.torre, md:row.modulo, p:row.piso, u:row.unidad_codigo, tp:row.tipologia,
    m2: row.m2===null ? null : String(row.m2),
    s: row.status,
    r: row.precio_lista===null ? null : Number(row.precio_lista).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}),
    d: row.display_code, cor: !!row.comision_corregida, cb: row.comprador,
  }));
}

function buildPresupuestoReal(nodos){
  const childrenMap = {};
  nodos.forEach(n=>{
    if(!childrenMap[n.parent_id]) childrenMap[n.parent_id] = [];
    childrenMap[n.parent_id].push(n);
  });
  Object.values(childrenMap).forEach(list=>list.sort((a,b)=>a.sort_order-b.sort_order));
  function build(node){
    return { n: node.nombre, c: Number(node.contratado), p: Number(node.pagado), h: (childrenMap[node.id]||[]).map(build) };
  }
  const roots = childrenMap[null] || [];
  const cats = [...new Set(nodos.map(n=>n.category_id))];
  const result = {};
  cats.forEach(cat=>{
    const catRoots = roots.filter(n=>n.category_id===cat).sort((a,b)=>a.sort_order-b.sort_order);
    result[cat] = {
      label: PRESUPUESTO_CAT_LABELS[cat] || cat,
      c: catRoots.reduce((s,n)=>s+Number(n.contratado),0),
      p: catRoots.reduce((s,n)=>s+Number(n.pagado),0),
      h: catRoots.map(build),
    };
  });
  return result;
}

function buildProyecto(rows){
  const r = rows[0] || {};
  return { nombre:r.nombre, ubicacion:r.ubicacion, descripcion:r.descripcion, ultimaActualizacion:r.ultima_actualizacion };
}
function buildTorres(rows){
  return rows.map(r=>({id:r.id, label:r.label, pct:numOrNull(r.pct)}));
}
function buildPartidaNombres(rows){
  return rows.slice().sort((a,b)=>a.idx-b.idx).map(r=>r.nombre);
}
function buildScopes(rows){
  const out = {};
  rows.forEach(r=>{ out[r.tower_id] = r.data; });
  return out;
}
function buildHitos(rows){ return rows.map(r=>({nombre:r.nombre, estado:r.estado, fecha:r.fecha})); }
function buildRiesgos(rows){ return rows.map(r=>({nivel:r.nivel, torre:r.torre, titulo:r.titulo, impacto:r.impacto, accion:r.accion})); }
function buildActividad(rows){ return rows.map(r=>({torre:r.torre, partida:r.partida, avance:numOrNull(r.avance), nota:r.nota})); }
function buildSemanas(rows){ return rows.map(r=>({torre:r.torre, semana:r.semana, fechas:r.fechas, nota:r.nota})); }

function showLoadingError(msg){
  const el = document.getElementById("loadingMsg");

  el.textContent = msg;
  el.classList.add("error");
  const overlay = document.getElementById("loadingOverlay");
  const btn = document.createElement("button");
  btn.className = "loading-retry";
  btn.textContent = "Reintentar";
  btn.addEventListener("click", ()=>location.reload());
  overlay.appendChild(btn);
}
