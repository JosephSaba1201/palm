<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALM | Control de Obra</title>

<!-- Instalable como app de acceso rápido (iPhone/Android) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3FA6A3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PALM Diamante">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icon-167.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/icon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<style>
/* ============================= TOKENS ============================= */
.loading-overlay{position:fixed;inset:0;z-index:9999;background:var(--page);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .25s ease;}
.loading-overlay.hidden{opacity:0;pointer-events:none;}
.loading-logo{width:120px;height:auto;opacity:.92;}
.loading-spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:loadspin .8s linear infinite;}
@keyframes loadspin{to{transform:rotate(360deg);}}
#loadingMsg{color:var(--ink-600);font-size:14px;}
#loadingMsg.error{color:#B4453A;max-width:340px;text-align:center;line-height:1.5;}
.loading-retry{margin-top:4px;padding:8px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;font-size:13px;cursor:pointer;}
:root{
  --page:#F6F4EE;
  --surface:#FCFBF8;
  --surface-raised:#FFFFFF;
  --ink-900:#171512;
  --ink-600:#55524B;
  --ink-400:#8B8778;
  --line:#E4E1D7;
  --line-strong:#D3CEBF;
  --accent:#3FA6A3;
  --accent-ink:#1F6461;
  --accent-soft:rgba(63,166,163,0.09);
  --accent-soft-strong:rgba(63,166,163,0.16);
  --plan:#BB9A5E;
  --good:#0ca30c;
  --good-soft:rgba(12,163,12,0.12);
  --warning-text:#9a6a00;
  --warning-fill:#fab219;
  --warning-soft:rgba(250,178,25,0.18);
  --critical:#d03b3b;
  --critical-soft:rgba(208,59,59,0.10);
  --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100;
  --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
  --cat-other:#ABA694;
  --shadow-sm:0 1px 2px rgba(23,21,18,0.05);
  --shadow-md:0 1px 2px rgba(23,21,18,0.04), 0 8px 24px -12px rgba(23,21,18,0.16);
  --font-display: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --radius-md:10px;
  --radius-lg:16px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--page);
  color:var(--ink-900);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:500;text-wrap:balance;}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--accent-soft-strong);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.tabular{font-variant-numeric:tabular-nums;}

/* ============================= SHELL ============================= */
.app{
  display:grid;
  grid-template-columns:248px 1fr;
  min-height:100vh;
}

/* -------- sidebar -------- */
.sidebar{
  background:var(--surface-raised);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  padding:26px 18px;
  gap:28px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:fixed;inset:0 auto 0 0;width:248px;transform:translateX(-100%);transition:transform .25s ease;z-index:50;}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.25);}
  .menu-toggle{display:flex !important;}
  .sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(23,21,18,.35);z-index:40;}
  .sidebar-scrim.show{display:block;}
}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 8px;}
.brand .logo-img{width:118px;height:auto;display:block;}
.brand .subline{font-size:11px;color:var(--ink-400);letter-spacing:.06em;text-transform:uppercase;}

.torre-switch{
  margin:0 8px;
  background:var(--page);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:4px;
  display:flex;flex-direction:column;gap:2px;
}
.torre-switch .label{font-size:10px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.08em;padding:4px 6px 2px;}
.torre-opt{
  border:none;background:transparent;text-align:left;padding:8px 8px;border-radius:7px;
  font-size:13px;color:var(--ink-600);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.torre-opt:hover{background:var(--surface-raised);}
.torre-opt.active{background:var(--accent);color:#fff;font-weight:600;}
.torre-opt .pct{font-size:11px;opacity:.85;}
.torre-opt .pct-wrap{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;}
.torre-opt .mdp{font-size:10px;opacity:.75;font-variant-numeric:tabular-nums;}
.torre-opt-main{font-weight:600;}
.torre-sub{display:flex;flex-direction:column;gap:1px;padding-left:12px;margin:1px 0 3px;border-left:2px solid var(--line);margin-left:16px;}
.torre-opt-sub{font-size:12.5px;padding:6px 8px;}
.torre-opt-sub:not(.active){color:var(--ink-400);}

nav.primary{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 10px;border-radius:8px;
  font-size:13.5px;color:var(--ink-600);
  cursor:pointer;border:none;background:transparent;width:100%;text-align:left;
}
.nav-item svg{flex:none;}
.nav-item:hover{background:var(--page);color:var(--ink-900);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}
.nav-item.active svg{stroke:var(--accent-ink);}

.sidebar-footer{margin-top:auto;padding:0 8px;display:flex;flex-direction:column;gap:10px;}
.role-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;color:var(--ink-600);
  border:1px solid var(--line-strong);border-radius:999px;padding:5px 10px;width:fit-content;
}
.role-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.update-line{font-size:11px;color:var(--ink-400);}

/* -------- topbar / main -------- */
.main{min-width:0;}
.topbar{
  position:sticky;top:0;z-index:10;
  background:var(--page);
  border-bottom:1px solid var(--line);
  padding:20px 32px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.topbar h1{font-size:22px;}
.topbar .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400);margin-bottom:2px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:var(--ink-600);
  background:var(--surface-raised);border:1px solid var(--line);border-radius:999px;padding:6px 12px;
}
.menu-toggle{display:none;border:1px solid var(--line);background:var(--surface-raised);border-radius:8px;width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer;}

.page{padding:28px 32px 64px;max-width:1320px;}
.page-section{display:none;animation:fade .3s ease;}
.page-section.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ============================= GRID / CARDS ============================= */
.grid{display:grid;gap:20px;}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-12{grid-template-columns:repeat(12,1fr);}
@media (max-width:1000px){.grid-2,.grid-3{grid-template-columns:1fr;}.grid-12{grid-template-columns:1fr;}}

.card{
  background:var(--surface-raised);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:22px;
  box-shadow:var(--shadow-sm);
}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;}
.card-head h3{font-size:15px;font-family:var(--font-sans);font-weight:600;color:var(--ink-900);}
.card-head .hint{font-size:11.5px;color:var(--ink-400);}
.section-title{font-size:19px;margin:36px 0 16px;}
.section-title:first-child{margin-top:0;}
.section-sub{font-size:12.5px;color:var(--ink-600);margin:-10px 0 18px;max-width:620px;}

/* -------- KPI cards -------- */
.kpi-card{display:flex;flex-direction:column;gap:10px;}
.kpi-card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);}
.kpi-card .value{font-family:var(--font-display);font-size:34px;line-height:1;}
.kpi-card .value small{font-family:var(--font-sans);font-size:13px;color:var(--ink-400);font-weight:400;margin-left:2px;}
.kpi-card .foot{font-size:12px;color:var(--ink-600);}
.kpi-card.hero .value{font-size:40px;color:var(--accent-ink);}
.progress-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:var(--accent);}
.progress-fill.plan{background:var(--plan);}

.status-pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;}
.status-pill.good{background:var(--good-soft);color:#0a7a0a;}
.status-pill.atencion{background:var(--warning-soft);color:var(--warning-text);}
.status-pill.atrasado{background:var(--critical-soft);color:var(--critical);}
.status-pill .dot{width:8px;height:8px;border-radius:50%;}
.status-pill.good .dot{background:var(--good);}
.status-pill.atencion .dot{background:var(--warning-fill);}
.status-pill.atrasado .dot{background:var(--critical);}
.badge-proceso{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;background:var(--warning-soft);color:var(--warning-text);margin-left:8px;vertical-align:middle;}
.status-pill.muted{background:var(--page);color:var(--ink-400);border:1px solid var(--line-strong);}
.t1-status-vendido:hover rect{fill:rgba(99,153,34,0.28) !important;}
.t1-status-disponible:hover rect{fill:rgba(120,120,120,0.28) !important;}
.t1-status-apartado:hover rect, .t1-status-reservado:hover rect{fill:rgba(186,117,23,0.30) !important;}
.inv-torre-group{margin-top:20px;}
.inv-torre-group:first-child{margin-top:0;}
.inv-torre-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-display);font-size:15px;font-weight:600;padding-bottom:8px;margin-bottom:10px;border-bottom:1.5px solid var(--line-strong);}
.inv-modulo-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media (max-width: 760px){ .inv-modulo-row{grid-template-columns:1fr;} }
.inv-modulo-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--ink-400);margin-bottom:6px;}
.inv-floor-row{display:flex;align-items:center;gap:8px;padding:1.5px 0;}
.inv-floor-num{width:26px;flex:none;font-size:10px;color:var(--ink-400);text-align:right;font-variant-numeric:tabular-nums;}
.inv-floor-units{display:flex;gap:4px;flex-wrap:wrap;}
.inv-chip{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:21px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:700;cursor:default;letter-spacing:.01em;}
.inv-chip-vendido{background:var(--good-soft);color:#0a7a0a;}
.inv-chip-disponible{background:var(--page);color:var(--ink-400);border:1px solid var(--line-strong);}
.inv-chip-apartado, .inv-chip-reservado{background:var(--warning-soft);color:var(--warning-text);}
.risk-card.real .flag{background:var(--cat-3);}

/* -------- partidas / progress rows -------- */
.partida-row{display:grid;grid-template-columns:170px 1fr 74px 128px;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);}
.partida-row:last-child{border-bottom:none;}
.partida-row .nombre{font-size:13px;font-weight:600;}
.partida-bars{position:relative;height:16px;}
.partida-bars .track{position:absolute;inset:0;top:5px;height:6px;background:var(--line);border-radius:99px;}
.partida-bars .fill-real{position:absolute;top:5px;height:6px;border-radius:99px;background:var(--accent);}
.partida-bars .mark-plan{position:absolute;top:0;width:2px;height:16px;background:var(--ink-900);opacity:.55;}
.partida-row .pct{font-size:12.5px;text-align:right;color:var(--ink-600);}
.partida-row .pct b{color:var(--ink-900);}
.legend-inline{display:flex;gap:18px;font-size:11.5px;color:var(--ink-600);margin-bottom:14px;}
.legend-inline span{display:inline-flex;align-items:center;gap:6px;}
.legend-inline i{width:10px;height:10px;border-radius:3px;display:inline-block;}

/* -------- activity / risk cards -------- */
.activity-card{display:flex;flex-direction:column;gap:10px;}
.activity-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.activity-card .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);}
.activity-card .avance{font-family:var(--font-display);font-size:22px;color:var(--accent-ink);}
.activity-card p{font-size:12.5px;color:var(--ink-600);}

.risk-card{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
.risk-card:last-child{border-bottom:none;}
.risk-card .flag{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;}
.risk-card.atencion .flag{background:var(--warning-fill);}
.risk-card.critico .flag{background:var(--critical);}
.risk-card .body{flex:1;}
.risk-card .title{font-size:13.5px;font-weight:600;margin-bottom:4px;}
.risk-card .meta{font-size:11.5px;color:var(--ink-400);margin-bottom:6px;}
.risk-card .row{font-size:12.5px;color:var(--ink-600);margin-top:3px;}
.risk-card .row b{color:var(--ink-900);}

/* -------- timeline (hitos) -------- */
.hitos-timeline{display:flex;flex-direction:column;}
.hito{display:grid;grid-template-columns:24px 1fr;gap:14px;}
.hito .rail{display:flex;flex-direction:column;align-items:center;}
.hito .node{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface-raised);flex:none;}
.hito .stem{width:2px;flex:1;background:var(--line);}
.hito.completado .node{background:var(--good);border-color:var(--good);}
.hito.en-proceso .node{background:var(--accent);border-color:var(--accent);}
.hito .content{padding-bottom:22px;}
.hito .content h4{font-size:13.5px;font-family:var(--font-sans);font-weight:600;}
.hito .content .meta{font-size:12px;color:var(--ink-400);margin-top:2px;}
.hito-state{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;margin-left:8px;}
.hito.completado .hito-state{background:var(--good-soft);color:#0a7a0a;}
.hito.en-proceso .hito-state{background:var(--accent-soft);color:var(--accent-ink);}
.hito.pendiente .hito-state{background:var(--line);color:var(--ink-400);}

/* -------- week strip -------- */
.week-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.week-card{border-left:2px solid var(--accent);padding:4px 0 4px 14px;}
.week-card .num{font-size:11px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.06em;}
.week-card .dates{font-size:11px;color:var(--ink-400);margin-bottom:6px;}
.week-card p{font-size:12.5px;}

/* -------- tables -------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface-raised);}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:680px;}
thead th{
  text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);
  padding:12px 16px;border-bottom:1px solid var(--line);background:var(--page);cursor:pointer;user-select:none;white-space:nowrap;
}
thead th:first-child,tbody td:first-child{text-align:left;}
thead th.sorted{color:var(--accent-ink);}
tbody td{padding:12px 16px;text-align:right;border-bottom:1px solid var(--line);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--page);}
td.name{text-align:left;font-weight:600;}
.tag-global{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-400);border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px;margin-left:6px;}
.var-neg{color:var(--critical);font-weight:600;}
.var-pos{color:#0a7a0a;font-weight:600;}

/* -------- charts -------- */
.chart-box{position:relative;}
.chart-box svg{width:100%;height:auto;display:block;overflow:visible;}
.axis-label{font-size:10px;fill:var(--ink-400);font-family:var(--font-sans);}
.grid-line{stroke:var(--line);stroke-width:1;}
.chart-pro .week-bar{transition:opacity .12s ease, transform .12s ease;transform-origin:center bottom;}
.chart-pro .week-bar:hover{opacity:0.82;}
.chart-pro .week-bar.is-sel{filter:drop-shadow(0 2px 4px rgba(31,100,97,0.25));}
.tooltip{
  position:fixed;pointer-events:none;z-index:200;
  background:var(--ink-900);color:#fff;font-size:11.5px;line-height:1.4;
  padding:8px 11px;border-radius:8px;box-shadow:var(--shadow-md);
  opacity:0;transform:translate(-50%,-100%);transition:opacity .1s ease;max-width:220px;
}
.tooltip.show{opacity:1;}
.tooltip b{display:block;font-weight:600;margin-bottom:2px;}
.t1-corte-row{display:flex;gap:20px;align-items:flex-start;}
.t1-corte-panel{width:280px;flex:none;}
.t1-corte-wrap{position:relative;flex:1;min-width:0;max-width:640px;border-radius:8px;overflow:hidden;aspect-ratio:1024/1536;}

/* -------- gallery -------- */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.photo-tile{border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line);background:var(--surface-raised);display:block;text-decoration:none;color:inherit;transition:box-shadow .15s ease,transform .15s ease;}
.photo-tile:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.photo-tile .art{height:150px;position:relative;background:var(--page);}
.photo-tile .art img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-tile .art .badge{position:absolute;top:8px;left:8px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;color:#fff;background:rgba(23,21,18,0.55);border-radius:5px;padding:3px 7px;}
.photo-tile .meta{padding:12px 14px;}
.photo-tile .zona{font-size:12.5px;font-weight:600;}
.photo-tile .fecha{font-size:11px;color:var(--ink-400);margin-top:2px;}
.photo-tile .cap{font-size:11.5px;color:var(--ink-600);margin-top:6px;}
.compare-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.compare-wrap .photo-tile .art{height:230px;}
.compare-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);padding:10px 14px 0;display:block;}

.timeline-strip{display:flex;overflow-x:auto;padding:6px 4px 10px;gap:0;}
.timeline-item{flex:none;width:116px;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;padding:0 4px;}
.timeline-thumb{width:92px;height:92px;border-radius:12px;overflow:hidden;border:2px solid var(--surface-raised);outline:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .15s ease;}
.timeline-item:hover .timeline-thumb{transform:scale(1.05);}
.timeline-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.timeline-connector{position:relative;width:100%;height:18px;}
.timeline-connector .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface-raised);z-index:2;}
.timeline-connector .line-l,.timeline-connector .line-r{position:absolute;top:50%;height:2px;background:var(--line-strong);}
.timeline-connector .line-l{left:0;right:50%;}
.timeline-connector .line-r{left:50%;right:0;}
.timeline-item:first-child .line-l,.timeline-item:last-child .line-r{background:transparent;}
.timeline-date{font-size:11px;color:var(--ink-600);margin-top:2px;white-space:nowrap;}

/* -------- budget tree (presupuesto / control de obra) -------- */
.budget-tree{padding:6px 14px;}
.budget-row{display:grid;grid-template-columns:1fr 130px 130px 120px;gap:14px;align-items:center;padding:9px 4px;}
.budget-row-3col{grid-template-columns:1fr 130px 150px;}
.budget-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);border-bottom:1px solid var(--line-strong);padding-bottom:10px;}
.budget-head span:not(:first-child){text-align:right;}
.budget-name{font-size:13px;display:flex;align-items:center;gap:8px;}
.chev{display:inline-block;width:10px;color:var(--ink-400);transition:transform .15s ease;flex:none;}
.chev-spacer{display:inline-block;width:10px;flex:none;}
details[open] > summary .chev{transform:rotate(90deg);color:var(--accent-ink);}
.budget-node{border-bottom:1px solid var(--line);}
.budget-node:last-child{border-bottom:none;}
.budget-node > summary{cursor:pointer;list-style:none;}
.budget-node > summary::-webkit-details-marker{display:none;}
.budget-node > summary:hover{background:var(--page);}
.budget-leaf{border-bottom:1px solid var(--line);}
.budget-leaf:last-child{border-bottom:none;}
.budget-leaf .budget-name{padding-left:10px;color:var(--ink-600);}
.budget-num{text-align:right;font-size:12.5px;}
.budget-pctcell{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-size:12px;}
.budget-pctcell b{width:38px;text-align:right;}
.progress-track.mini{height:5px;width:60px;flex:none;}

/* -------- filters row -------- */
.filter-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.filter-row select{
  font-family:inherit;font-size:12.5px;color:var(--ink-600);
  border:1px solid var(--line-strong);background:var(--surface-raised);border-radius:8px;padding:8px 10px;
}
.galcat-opt{
  font-family:inherit;font-size:12.5px;color:var(--ink-600);cursor:pointer;
  border:1px solid var(--line-strong);background:var(--surface-raised);border-radius:999px;padding:7px 14px;
}
.galcat-opt:hover{background:var(--page);}
.galcat-opt.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

/* -------- quick budget search -------- */
.qb-input{
  width:100%;font-family:inherit;font-size:14px;color:var(--ink-900);
  border:1px solid var(--line-strong);background:var(--page);border-radius:10px;padding:12px 14px;
}
.qb-input:focus{outline:none;border-color:var(--accent);background:var(--surface-raised);}
.qb-results{margin-top:4px;}
.qb-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
.qb-toolbar .qb-input{flex:1;min-width:180px;margin-top:0;}
.sort-select{
  font-family:inherit;font-size:12px;color:var(--ink-600);
  border:1px solid var(--line-strong);background:var(--surface-raised);border-radius:8px;
  padding:9px 10px;flex:none;cursor:pointer;
}
.sort-select:focus{outline:none;border-color:var(--accent);}
.qb-total{
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;
  margin-top:16px;padding:12px 14px;background:var(--accent-soft);border-radius:10px;font-size:13px;color:var(--accent-ink);
}
.qb-total b{font-size:15px;}
.qb-breakdown{margin-top:10px;}
.qb-row{display:flex;justify-content:space-between;gap:16px;padding:12px 4px;border-bottom:1px solid var(--line);}
.qb-row-clickable{cursor:pointer;border-radius:8px;}
.qb-row-clickable:hover{background:var(--page);}
.qb-row:last-child{border-bottom:none;}
.qb-row-actions{display:flex;align-items:center;gap:10px;}
.qb-pdf-btn{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:4px 8px;cursor:pointer;white-space:nowrap;}
.qb-pdf-btn:hover{background:var(--accent);color:#fff;}
.btn-ver-mas{display:block;width:100%;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--accent-ink);background:var(--page);border:1px dashed var(--line-strong);border-radius:8px;padding:10px;cursor:pointer;text-align:center;}
.btn-ver-mas:hover{background:var(--accent-soft);border-color:var(--accent);}
.qb-selbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;background:var(--page);border:1px solid var(--line);border-radius:8px;}
.qb-selall{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-600);cursor:pointer;white-space:nowrap;}
.qb-selinfo{font-size:12px;color:var(--ink-400);flex:1;}
.qb-selinfo b{color:var(--ink-900);}
.qb-check{display:flex;align-items:center;padding-right:2px;}
.qb-row-check{justify-content:flex-start;align-items:center;}
.qb-row-check>div:nth-child(2){flex:1;min-width:0;}
.qb-cat{font-size:13px;font-weight:600;}
.qb-items{font-size:11.5px;color:var(--ink-400);margin-top:2px;max-width:420px;}
.qb-nums{text-align:right;font-size:13px;flex:none;width:170px;}
.qb-nums .foot{font-size:11px;}

/* -------- report -------- */
.report-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
.report-head .id{font-size:11px;color:var(--ink-400);}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;
  font-size:12.5px;font-weight:600;cursor:pointer;
}
.btn:hover{background:var(--accent-ink);}
.report-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;}
@media (max-width:1000px){.report-grid{grid-template-columns:1fr;}}
.report-list{display:flex;flex-direction:column;gap:8px;}
.report-list .item{display:flex;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);}
.report-list .item:last-child{border-bottom:none;}

/* ============================= MOBILE REFINEMENTS ============================= */
@media (max-width:640px){
  .topbar{padding:14px 16px;gap:8px;}
  .topbar h1{font-size:18px;}
  .topbar-right{gap:8px;}
  .chip{font-size:11px;padding:5px 10px;}
  .menu-toggle{width:40px;height:40px;}
  .page{padding:18px 16px 48px;}
  .card{padding:16px;}
  .section-title{font-size:17px;margin:28px 0 14px;}
  .grid{gap:14px;}
  .kpi-card .value{font-size:28px;}
  .kpi-card.hero .value{font-size:32px;}

  /* bigger, easier-to-tap navigation */
  .sidebar{width:82vw;max-width:300px;}
  .nav-item{padding:13px 10px;font-size:14.5px;gap:13px;}
  .torre-opt{padding:11px 8px;}

  /* progress rows: stack instead of squeezing 4 fixed columns */
  .partida-row{grid-template-columns:1fr;row-gap:6px;padding:14px 0;}
  .partida-row-head{display:none;}
  .partida-row .pct{text-align:left;}

  /* budget tree: shrink fixed number columns so it fits without scrolling */
  .budget-row{grid-template-columns:1fr 76px 76px;gap:8px;font-size:11.5px;}
  .budget-row-3col{grid-template-columns:1fr 76px 86px;}
  .budget-pctcell{gap:5px;}
  .progress-track.mini{width:32px;}

  .week-strip{grid-template-columns:repeat(2,1fr);gap:14px;}
  .compare-wrap{grid-template-columns:1fr;}
  .compare-wrap .photo-tile .art{height:190px;}

  .qb-row{flex-wrap:wrap;}
  .qb-nums{width:auto;margin-left:auto;}
  .qb-items{max-width:100%;}

  .t1-corte-row{flex-direction:column;}
  .t1-corte-panel{width:100%;}
  .t1-corte-wrap{flex:none;width:100%;}

  .table-wrap,.timeline-strip{-webkit-overflow-scrolling:touch;}
}

@media print{
  .sidebar,.topbar,.menu-toggle{display:none !important;}
  .app{display:block;}
  .page-section{display:none !important;}
  #page-reporte{display:block !important;}
  body{background:#fff;}
  .card{box-shadow:none;border:1px solid #ccc;}
}

const tipEl = document.getElementById("tooltip");
function showTip(x,y,html){
  tipEl.innerHTML = html;
  tipEl.style.left = x+"px";
  tipEl.style.top = (y-10)+"px";
  tipEl.classList.add("show");
}
function hideTip(){ tipEl.classList.remove("show"); }
function wireTips(root){
  root.querySelectorAll("[data-tip]").forEach(el=>{
    el.addEventListener("mousemove", e=>showTip(e.clientX, e.clientY, el.getAttribute("data-tip")));
    el.addEventListener("mouseleave", hideTip);
  });
}

/* ============================================================ CHART BUILDERS ============================================================ */
// S-curve: programado vs real, area under 'real'
function svgCurvaS(data, w=760, h=260){
  const pad={l:36,r:16,t:16,b:26};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const n=data.length;
  const x=i=> pad.l + (iw*i/(n-1));
  const y=v=> pad.t + ih - (ih*v/100);
  const ptsProg=data.map((d,i)=>d[1]!=null?[x(i),y(d[1])]:null).filter(Boolean);
  const ptsReal=data.map((d,i)=>d[2]!=null?[x(i),y(d[2])]:null).filter(Boolean);
  const pathOf=pts=>pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const areaReal = pathOf(ptsReal) + ` L ${ptsReal[ptsReal.length-1][0].toFixed(1)},${y(0)} L ${ptsReal[0][0].toFixed(1)},${y(0)} Z`;
  const gridY=[0,25,50,75,100];
  let grid = gridY.map(v=>`<line class="grid-line" x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-label" x="${pad.l-8}" y="${y(v)+3}" text-anchor="end">${v}%</text>`).join("");
  let xlabels = data.map((d,i)=> (i%3===0 || i===n-1) ? `<text class="axis-label" x="${x(i)}" y="${h-6}" text-anchor="middle">${d[0]}</text>` : "").join("");
  let hits = data.map((d,i)=>{
    const cx=x(i);
    const tip = `<b>${d[0]}</b>Programado: ${d[1]!=null?d[1]+"%":"—"}<br>Real: ${d[2]!=null?d[2]+"%":"—"}`;
    return `<rect data-tip='${tip}' x="${cx-9}" y="${pad.t}" width="18" height="${ih}" fill="transparent"/>`;
  }).join("");
  const lastReal = ptsReal[ptsReal.length-1];
  return `<svg viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="curvaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${areaReal}" fill="url(#curvaFill)"/>
    <path d="${pathOf(ptsProg)}" fill="none" stroke="var(--plan)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${pathOf(ptsReal)}" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
    <circle cx="${lastReal[0]}" cy="${lastReal[1]}" r="4.5" fill="var(--accent)" stroke="#fff" stroke-width="2"/>
    ${xlabels}
    ${hits}
  </svg>`;
}

// indexed % line: gasto acumulado % vs avance físico % (single axis)
function svgIndexed(data, w=520, h=220){
  const pad={l:34,r:14,t:14,b:24};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const n=data.length;
  const x=i=> pad.l + (iw*i/(n-1));
  const y=v=> pad.t + ih - (ih*v/100);
  const pFis=data.map((d,i)=>[x(i),y(d[1])]);
  const pGas=data.map((d,i)=>[x(i),y(d[2])]);
  const pathOf=pts=>pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const gridY=[0,50,100];
  let grid = gridY.map(v=>`<line class="grid-line" x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-label" x="${pad.l-8}" y="${y(v)+3}" text-anchor="end">${v}%</text>`).join("");
  let xlabels = data.map((d,i)=>`<text class="axis-label" x="${x(i)}" y="${h-6}" text-anchor="middle">${d[0]}</text>`).join("");
  let hits = data.map((d,i)=>{
    const tip = `<b>${d[0]}</b>Avance físico: ${d[1]}%<br>Gasto acumulado: ${d[2]}%`;
    return `<rect data-tip='${tip}' x="${x(i)-14}" y="${pad.t}" width="28" height="${ih}" fill="transparent"/>`;
  }).join("");
  const lastF=pFis[pFis.length-1], lastG=pGas[pGas.length-1];
  return `<svg viewBox="0 0 ${w} ${h}">
    ${grid}
    <path d="${pathOf(pFis)}" fill="none" stroke="var(--cat-3)" stroke-width="2.4"/>
    <path d="${pathOf(pGas)}" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
    <circle cx="${lastF[0]}" cy="${lastF[1]}" r="4" fill="var(--cat-3)" stroke="#fff" stroke-width="2"/>
    <circle cx="${lastG[0]}" cy="${lastG[1]}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="2"/>
    ${xlabels}
    ${hits}
  </svg>`;
}

// grouped monthly bars: presupuestado vs real
function svgFlujo(data, w=760, h=240){
  const pad={l:38,r:14,t:14,b:26};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max = Math.max(...data.map(d=>Math.max(d[1],d[2]||0)))*1.15;
  const n=data.length, groupW=iw/n, barW=groupW*0.3;
  const y=v=> pad.t + ih - (ih*v/max);
  let grid=[0,0.5,1].map(f=>{const v=max*f; return `<line class="grid-line" x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-label" x="${pad.l-8}" y="${y(v)+3}" text-anchor="end">${v.toFixed(0)}</text>`;}).join("");
  let bars="", labels="";
  data.forEach((d,i)=>{
    const gx = pad.l + groupW*i + groupW/2;
    const isProj = d[2]==null;
    const tipPresup = `<b>${d[0]}</b>Presupuestado: $${d[1].toFixed(1)}M`;
    bars += `<rect data-tip="${tipPresup}" x="${(gx-barW*1.15).toFixed(1)}" y="${y(d[1]).toFixed(1)}" width="${barW.toFixed(1)}" height="${(ih-(y(d[1])-pad.t)).toFixed(1)}" fill="var(--plan)" rx="2"/>`;
    if(!isProj){
      const tipReal = `<b>${d[0]}</b>Gasto real: $${d[2].toFixed(1)}M`;
      bars += `<rect data-tip="${tipReal}" x="${(gx+barW*0.15).toFixed(1)}" y="${y(d[2]).toFixed(1)}" width="${barW.toFixed(1)}" height="${(ih-(y(d[2])-pad.t)).toFixed(1)}" fill="var(--accent)" rx="2"/>`;
    } else {
      bars += `<rect x="${(gx+barW*0.15).toFixed(1)}" y="${pad.t}" width="${barW.toFixed(1)}" height="${ih}" fill="none" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3 3" rx="2"/>`;
    }
    labels += `<text class="axis-label" x="${gx}" y="${h-6}" text-anchor="middle">${d[0]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}">${grid}${bars}${labels}</svg>`;
}

// horizontal category breakdown bar (stacked single row) for presupuesto mix
function svgMix(items, w=760, h=54){
  const total = items.reduce((s,d)=>s+d.valor,0) || 1;
  let x=8, bars="";
  items.forEach(d=>{
    const wd = (w-16)*d.valor/total;
    const pct = 100*d.valor/total;
    const tip = `<b>${d.nombre}</b>${fmtMXN(d.valor,true)} · ${pct.toFixed(1)}%`;
    const segW = Math.max(wd-2,0);
    bars += `<rect data-tip="${tip}" x="${x.toFixed(1)}" y="10" width="${segW.toFixed(1)}" height="30" rx="4" fill="${d.color}"/>`;
    if(segW>34){
      bars += `<text data-tip="${tip}" x="${(x+segW/2).toFixed(1)}" y="29" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">${pct.toFixed(0)}%</text>`;
    }
    x += wd;
  });
  return `<svg viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}
function topNWithOther(items, n){
  const sorted = [...items].sort((a,b)=>b.valor-a.valor);
  if(sorted.length<=n) return sorted;
  const top = sorted.slice(0,n);
  const rest = sorted.slice(n).reduce((s,d)=>s+d.valor,0);
  return [...top, {nombre:"Otros", valor:rest, color:"var(--cat-other)"}];
}

function flagsFinancierosReal(){
  const flags = [];
  function evalOne(label, contratado, pagado){
    const pct = contratado>0 ? pagado/contratado*100 : 0;
    if(pagado > contratado){
      flags.push({nivel:"critico", titulo:`${label}: pagado supera lo contratado`, detalle:`Pagado ${fmtMXN(pagado,true)} vs. contratado ${fmtMXN(contratado,true)} (${fmtPct(pct)} del contrato).`});

      flags.push({nivel:"atencion", titulo:`${label}: cerca de agotar lo contratado`, detalle:`Pagado ${fmtMXN(pagado,true)} de ${fmtMXN(contratado,true)} contratados (${fmtPct(pct)}). Valorar si se requiere ampliación.`});
    }
  }
  if(currentScope==="consolidado"){

/* ---- Consulta rápida: busca por nombre de partida/torre/contratista y suma contratado/pagado ---- */
function normTxt(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}
// Palabras de relleno en preguntas naturales ("\u00bfcu\u00e1nto me cost\u00f3...?") que no deben exigirse como parte del nombre a buscar.
const STOPWORDS = new Set(["cuanto","cuantos","cuanta","cuantas","costo","cuesta","costaron","cuestan",
  "gaste","gasto","gastado","gastamos","pague","pago","pagado","pagamos","pagaron",
  "llevamos","llevo","va","van","vamos","suma","sumo","total","es","el","la","los","las",
  "de","del","en","a","al","por","para","con","y","o","que","cual","cuales","dime","dame",
  "hay","tenemos","tengo","me","nos","se","ha","han","hemos","presupuesto","presupuestado",
  "contratado","real","reales","invertido","erogado"]);
function stripStopwords(terms){
  const kept = terms.filter(t=>!STOPWORDS.has(t));
  return kept.length ? kept : terms; // si se qued\u00f3 vac\u00edo, mejor usar los originales que no buscar nada
}
function collectMatches(node, terms, out){
  const name = normTxt(node.n);
  const isMatch = terms.every(t=>name.includes(t));
  if(isMatch){
    out.push(node);
    return; // no bajar a hijos: ya se cuenta el subtotal completo de este nodo
  }
  (node.h||[]).forEach(ch=>collectMatches(ch, terms, out));
}
function extraerFiltroTorre(norm){
  const patrones = [
    [/\btorre\s*1\b|\bt1\b/, "t1"],
    [/\btorre\s*2\b|\bt2\b/, "t2"],
    [/\btorre\s*3\b|\bt3\b/, "t3"],
    [/\bamenidades?\b/, "amenidades"],
    [/\bservicios?(\s+generales?)?\b/, "servicios"],
  ];
  for(const [re, key] of patrones){
    if(re.test(norm)) return {key, texto: norm.replace(re,"").replace(/\s+/g," ").trim()};
  }
  return {key:null, texto:norm};
}
function searchPresupuesto(query){
  const norm = normTxt(query);
  const {key:catKey, texto} = extraerFiltroTorre(norm);
  const terms = stripStopwords(texto.split(/\s+/).filter(Boolean));
  const cats = catKey ? [catKey] : PRESUPUESTO_CAT_ORDER;
  const out = [];
  cats.forEach(k=>{
    const cat = PRESUPUESTO_REAL[k];
    let matches = [];
    if(terms.length===0){
      matches = cat.h; // solo se dio la torre: mostrar todas sus partidas
    } else {
      cat.h.forEach(p=>collectMatches(p, terms, matches));
    }
    if(matches.length){
      const c = matches.reduce((s,m)=>s+m.c,0), p = matches.reduce((s,m)=>s+m.p,0);
      out.push({categoria:cat.label, matches, c, p});
    }
  });
  return out;
}
function renderQuickSearch(query){

const MESES_CORTOS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function mesesCombinados(cats, ultimosN){

function svgPagosMensual(data, w=900, h=230){
  const pad={l:40,r:14,t:14,b:26};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max = Math.max(...data.map(d=>d[1]), 1)*1.15;
  const n=data.length, colW=iw/n, barW=Math.min(colW*0.6, 34);
  const y=v=> pad.t + ih - (ih*v/max);
  let grid=[0,0.5,1].map(f=>{const v=max*f; return `<line class="grid-line" x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-label" x="${pad.l-8}" y="${y(v)+3}" text-anchor="end">${v.toFixed(0)}M</text>`;}).join("");
  let bars="", labels="";
  data.forEach((d,i)=>{
    const cx = pad.l + colW*i + colW/2;
    const tip = `<b>${d[0]}</b>${fmtMXN(d[1]*1e6,true)}`;
    bars += `<rect data-tip="${tip}" x="${(cx-barW/2).toFixed(1)}" y="${y(d[1]).toFixed(1)}" width="${barW.toFixed(1)}" height="${(ih-(y(d[1])-pad.t)).toFixed(1)}" fill="var(--accent)" rx="2"/>`;
    if(i%Math.ceil(n/14||1)===0 || i===n-1) labels += `<text class="axis-label" x="${cx}" y="${h-6}" text-anchor="middle">${d[0]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}">${grid}${bars}${labels}</svg>`;
}

        <div class="qb-row-actions">
          <div class="qb-nums tabular"><b>${fmtMXN(p.s,true)}</b></div>
          <button type="button" class="qb-pdf-btn" data-pdfprov="${p.n.replace(/"/g,'&quot;')}" title="Descargar reporte PDF de este proveedor">PDF</button>
        </div>
      </div>`).join("") : `<p class="foot" style="margin-top:12px;">Sin coincidencias.</p>`}
    ${filtered.length>limite ? `<button type="button" class="btn-ver-mas" data-vermas="${resultsId}">Ver más proveedores (${filtered.length-limite} restantes)</button>` : ""}`;
  const hint = document.getElementById(hintId);
  if(hint) hint.textContent = filtered.length>limite ? `Mostrando ${limite} de ${filtered.length}` : `${filtered.length} proveedor${filtered.length===1?"":"es"}`;
  const sel = el.querySelector(`[data-sortid="${sortId}"]`);
  if(sel) sel.addEventListener("change", ()=>{ setSort(sortId, sel.value); renderProveedores(cats, catKeys, resultsId, hintId, onProvClick); });
  if(onProvClick) el.querySelectorAll("[data-prov]").forEach(row=>row.addEventListener("click", ()=>onProvClick(row.dataset.prov)));
  el.querySelectorAll("[data-pdfprov]").forEach(btn=>btn.addEventListener("click", (e)=>{
    e.stopPropagation();
    descargarReportePagosProveedor(btn.dataset.pdfprov, catKeys);
  }));
  const verMasBtn = el.querySelector("[data-vermas]");
  if(verMasBtn) verMasBtn.addEventListener("click", ()=>{
    pvLimite[resultsId] = limite + PV_PAGE_SIZE;
    renderProveedores(cats, catKeys, resultsId, hintId, onProvClick);
  });
  el.querySelectorAll("[data-checkprov]").forEach(chk=>chk.addEventListener("change", ()=>{
    if(!pvSeleccion[resultsId]) pvSeleccion[resultsId] = new Set();
    if(chk.checked) pvSeleccion[resultsId].add(chk.value); else pvSeleccion[resultsId].delete(chk.value);
    renderProveedores(cats, catKeys, resultsId, hintId, onProvClick);
  }));
  const selAllChk = el.querySelector("[data-selall]");
  if(selAllChk) selAllChk.addEventListener("change", ()=>{
    pvSeleccion[resultsId] = selAllChk.checked ? new Set(filtered.map(p=>p.n)) : new Set();
    renderProveedores(cats, catKeys, resultsId, hintId, onProvClick);
  });
  const pdfResumenBtn = el.querySelector("[data-pdfresumen]");
  if(pdfResumenBtn) pdfResumenBtn.addEventListener("click", ()=>{
    const base = seleccionados.length>0 ? seleccionados : filtered;
    descargarResumenProveedoresPDF(base.map(p=>p.n), catKeys, seleccionados.length>0);
  });
}

function descargarReportePagosProveedor(nombre, catKeys){
  const items = PAGOS_ITEMS.filter(x=>x.b===nombre && (!catKeys || catKeys.includes(x.cat)));
  if(!items.length) return;
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert("No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo.");
    return;
  }
  try {
  const total = items.reduce((s,x)=>s+x.im,0);
  const fechasOrd = items.map(x=>x.f).slice().sort();

  // Área (torre/amenidades/etc.) -> Partida -> pagos, para que quede claro a qué torre va cada grupo
  const areas = {};
  items.forEach(x=>{
    const areaKey = x.cat;
    const partidaKey = x.sp || "SIN PARTIDA";
    if(!areas[areaKey]) areas[areaKey] = {s:0, c:0, partidas:{}};
    areas[areaKey].s += x.im; areas[areaKey].c += 1;
    if(!areas[areaKey].partidas[partidaKey]) areas[areaKey].partidas[partidaKey] = {n:partidaKey, s:0, c:0, items:[]};
    const g = areas[areaKey].partidas[partidaKey];
    g.s += x.im; g.c += 1; g.items.push(x);
  });
  const areaKeysOrdenadas = PAGOS_CAT_ORDER_KEYS.filter(k=>areas[k]);
  areaKeysOrdenadas.forEach(k=>{
    Object.values(areas[k].partidas).forEach(g=>g.items.sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0));
  });

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"letter" });
  const marginL = 40;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const logoW = 42, logoH = 42 * (417/360);
  const headerTop = 34;
  const topSinMembrete = 40; // páginas después de la primera: sin logo/membrete, para no tapar la tabla

  function drawLetterhead(){
    doc.addImage(PALM_LOGO_B64, "PNG", marginL, headerTop, logoW, logoH);
    doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.setTextColor(31,100,97);
    doc.text("PALM Diamante", marginL + logoW + 14, headerTop + 20);
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(90,87,80);
    doc.text("Reporte de Pagos por Proveedor", marginL + logoW + 14, headerTop + 36);
    doc.setDrawColor(63,166,163);
    doc.setLineWidth(1.2);
    doc.line(marginL, headerTop + logoH + 8, pageW-marginL, headerTop + logoH + 8);
    return headerTop + logoH + 26;
  }

  let y = drawLetterhead(); // el membrete con logo va SOLO en esta primera hoja

  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(23,21,18);
  doc.text(nombre, marginL, y);
  y += 17;
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(90,87,80);
  doc.text(`Total pagado: ${fmtMXN(total,true)}   ·   ${items.length} pago${items.length===1?"":"s"}   ·   ${fmtFecha(fechasOrd[0])} — ${fmtFecha(fechasOrd[fechasOrd.length-1])}`, marginL, y);
  y += 12;
  doc.setDrawColor(228,225,215);
  doc.setLineWidth(0.5);
  doc.line(marginL, y, pageW-marginL, y);
  y += 16;

  areaKeysOrdenadas.forEach(areaKey=>{
    const area = areas[areaKey];
    if(y > pageH-110){ doc.addPage(); y = topSinMembrete; }
    doc.setFont("helvetica","bold"); doc.setFontSize(12.5); doc.setTextColor(31,100,97);
    doc.text(PAGOS_CAT_LABELS[areaKey] || areaKey, marginL, y);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(90,87,80);
    doc.text(`${fmtMXN(area.s,true)}  ·  ${area.c} pago${area.c===1?"":"s"}`, pageW-marginL, y, {align:"right"});
    y += 12;

    const partidasOrdenadas = Object.values(area.partidas).sort((a,b)=>b.s-a.s);
    partidasOrdenadas.forEach(g=>{
      if(y > pageH-100){ doc.addPage(); y = topSinMembrete; }
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(23,21,18);
      doc.text(g.n, marginL+8, y);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(90,87,80);
      doc.text(`${fmtMXN(g.s,true)}  ·  ${g.c} pago${g.c===1?"":"s"}`, pageW-marginL, y, {align:"right"});
      y += 8;

      doc.autoTable({
        startY: y,
        margin: {left: marginL+8, right: marginL},
        head: [["Fecha","Concepto","Semana","Importe"]],
        body: g.items.map(x=>[fmtFecha(x.f), x.co, x.sem||"", fmtMXN(x.im,true)]),
        styles: {fontSize:8.5, cellPadding:4, textColor:[40,38,34], lineColor:[228,225,215], lineWidth:0.5},
        headStyles: {fillColor:[63,166,163], textColor:255, fontStyle:"bold"},
        columnStyles: {0:{cellWidth:56}, 2:{cellWidth:42}, 3:{cellWidth:75, halign:"right"}},
        theme: "striped",
        didDrawPage: () => { y = topSinMembrete; },
      });
      y = doc.lastAutoTable.finalY + 16;
    });
    y += 8;
  });

  const nombreArchivo = nombre.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,60);
  doc.save(`Pagos_${nombreArchivo}.pdf`);
  } catch(err) {
    console.error("Error generando PDF de proveedor:", err);
    alert("No se pudo generar el PDF (" + nombre + "). Error: " + err.message);
  }
}

/* ---- Reporte en PDF de varios proveedores juntos: totales por Área (Torre 1, Torre 2, Amenidades, etc.)
   y dentro de cada área por Partida, sin desglosar pago por pago ---- */
function descargarResumenProveedoresPDF(nombres, catKeys, esSeleccion){
  if(!nombres || !nombres.length) return;
  const nombresSet = new Set(nombres);
  const items = PAGOS_ITEMS.filter(x=>nombresSet.has(x.b) && (!catKeys || catKeys.includes(x.cat)));
  if(!items.length) return;
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert("No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo.");
    return;
  }
  try {

  // Área (torre/categoría) -> Partida -> Proveedor -> {s,c}
  const areas = {};
  items.forEach(x=>{
    const areaKey = x.cat;
    const partidaKey = x.sp || "SIN PARTIDA";
    if(!areas[areaKey]) areas[areaKey] = {total:0, count:0, partidas:{}};
    const area = areas[areaKey];
    area.total += x.im; area.count += 1;
    if(!area.partidas[partidaKey]) area.partidas[partidaKey] = {total:0, count:0, provs:{}};
    const partida = area.partidas[partidaKey];
    partida.total += x.im; partida.count += 1;
    if(!partida.provs[x.b]) partida.provs[x.b] = {n:x.b, s:0, c:0};
    partida.provs[x.b].s += x.im; partida.provs[x.b].c += 1;
  });
  const totalGeneral = items.reduce((s,x)=>s+x.im,0);
  const totalPagos = items.length;
  const areaKeysOrdenadas = PAGOS_CAT_ORDER_KEYS.filter(k=>areas[k]);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"letter" });
  const marginL = 40;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const logoW = 42, logoH = 42 * (417/360);
  const headerTop = 34;
  const topSinMembrete = 40; // páginas después de la primera: sin logo/membrete

  // Membrete con logo: solo en esta primera hoja
  doc.addImage(PALM_LOGO_B64, "PNG", marginL, headerTop, logoW, logoH);
  doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.setTextColor(31,100,97);
  doc.text("PALM Diamante", marginL + logoW + 14, headerTop + 20);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(90,87,80);
  doc.text("Resumen de Pagos por Área y Partida", marginL + logoW + 14, headerTop + 36);
  doc.setDrawColor(63,166,163);
  doc.setLineWidth(1.2);
  doc.line(marginL, headerTop + logoH + 8, pageW-marginL, headerTop + logoH + 8);
  let y = headerTop + logoH + 26;

  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(90,87,80);
  doc.text(`${esSeleccion ? "Proveedores seleccionados" : "Todos los proveedores"}: ${nombresSet.size}   ·   ${totalPagos} pago${totalPagos===1?"":"s"}`, marginL, y);
  y += 20;

  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(23,21,18);
  doc.text(`Total: ${fmtMXN(totalGeneral,true)}`, marginL, y);
  y += 14;
  doc.setDrawColor(228,225,215);
  doc.line(marginL, y, pageW-marginL, y);
  y += 14;

  areaKeysOrdenadas.forEach(areaKey=>{
    const area = areas[areaKey];
    if(y > pageH-110){ doc.addPage(); y = topSinMembrete; }
    doc.setFont("helvetica","bold"); doc.setFontSize(12.5); doc.setTextColor(31,100,97);
    doc.text(PAGOS_CAT_LABELS[areaKey] || areaKey, marginL, y);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(90,87,80);
    doc.text(`${fmtMXN(area.total,true)}  ·  ${area.count} pago${area.count===1?"":"s"}`, pageW-marginL, y, {align:"right"});
    y += 10;

    const partidasOrdenadas = Object.entries(area.partidas).sort((a,b)=>b[1].total-a[1].total);
    partidasOrdenadas.forEach(([partidaNombre, partida])=>{
      if(y > pageH-90){ doc.addPage(); y = topSinMembrete; }
      doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(23,21,18);
      doc.text(partidaNombre, marginL+8, y);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(90,87,80);
      doc.text(`${fmtMXN(partida.total,true)}  ·  ${partida.count} pago${partida.count===1?"":"s"}`, pageW-marginL, y, {align:"right"});
      y += 6;

      const provRows = Object.values(partida.provs).sort((a,b)=>b.s-a.s);
      doc.autoTable({
        startY: y,
        margin: {left: marginL+8, right: marginL},
        head: [["Proveedor","Pagos","Total"]],
        body: provRows.map(p=>[p.n, String(p.c), fmtMXN(p.s,true)]),
        styles: {fontSize:8.5, cellPadding:4, textColor:[40,38,34], lineColor:[228,225,215], lineWidth:0.5},
        headStyles: {fillColor:[63,166,163], textColor:255, fontStyle:"bold"},
        columnStyles: {1:{cellWidth:50, halign:"right"}, 2:{cellWidth:80, halign:"right"}},
        theme: "striped",
        didDrawPage: () => { y = topSinMembrete; },
      });
      y = doc.lastAutoTable.finalY + 14;
    });
    y += 6;
  });

  if(y > pageH-60){ doc.addPage(); y = topSinMembrete; }
  doc.setDrawColor(31,100,97);
  doc.setLineWidth(1.2);
  doc.line(marginL, y, pageW-marginL, y);
  y += 18;
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(31,100,97);
  doc.text(`TOTAL GENERAL: ${fmtMXN(totalGeneral,true)}`, marginL, y);

  const stamp = esSeleccion ? `Seleccion_${nombresSet.size}` : "Todos";
  doc.save(`Resumen_Proveedores_${stamp}.pdf`);
  } catch(err) {
    console.error("Error generando PDF resumen de proveedores:", err);
    alert("No se pudo generar el PDF resumen. Error: " + err.message);
  }
}

/* ---- Consulta rápida de Control de Obra: busca en los pagos reales itemizados ---- */
function searchPagosItems(query, catKeys){
  const norm = normTxt(query);
  const {key:catKey, texto} = extraerFiltroTorre(norm);
  const terms = stripStopwords(texto.split(/\s+/).filter(Boolean));
  let scope = catKeys;
  if(catKey){
    const mapped = catKey==="servicios" ? "general" : catKey;
    if(scope.includes(mapped)) scope = [mapped];
  }
  let items = PAGOS_ITEMS.filter(x=>scope.includes(x.cat));
  if(terms.length){
    items = items.filter(x=>{
      const hay = normTxt(x.b+" "+x.sp+" "+x.co);
      return terms.every(t=>hay.includes(t));
    });
  }
  return items;
}
// Lista genérica de movimientos: FECHA | CONCEPTO | MONTO, con selector de orden (fecha/monto) que se re-wirea solo.
function renderItemList(items, resultsId, sortId, opts){
  opts = opts || {};
  const el = document.getElementById(resultsId);
  if(!el) return;
  if(items.length===0){
    el.innerHTML = `<p class="foot" style="margin-top:12px;">${opts.emptyMsg || "Sin resultados."}</p>`;
    return;
  }
  const total = items.reduce((s,x)=>s+x.im,0);
  const sortKey = getSort(sortId, "fecha_desc");
  const shown = sortItems(items, sortKey, "f", "im");
  el.innerHTML = `
    <div class="qb-toolbar" style="margin-top:0;">
      <div class="qb-total" style="flex:1;margin-top:0;">
        <span>Total encontrado</span>
        <span class="tabular"><b>${fmtMXN(total,true)}</b> · ${items.length} pago${items.length===1?"":"s"}</span>
      </div>
      ${sortSelectHtml(sortId, true)}

  `;
  const sel = el.querySelector(`[data-sortid="${sortId}"]`);
  if(sel) sel.addEventListener("change", ()=>{ setSort(sortId, sel.value); if(opts.rerender) opts.rerender(); });
}
function renderPagosSearch(query, catKeys, resultsId){
  resultsId = resultsId || "pgResults";

  if(!query || !query.trim()){ el.innerHTML = ""; return; }

// En "amenidades" casi todos los pagos comparten la misma PARTIDA ("AMENIDADES"),
// así que agrupar por partida (como en las demás categorías) da un solo bloque sin
// utilidad. Ahí se agrupa por tipo de amenidad (SUBPARTIDA) en su lugar.
const AMENITY_BUCKET_MAP = {
  "ALBERCAS":"Albercas", "ALBERCA":"Albercas", "ALBERCA T1":"Albercas", "ALBERCA T2":"Albercas",
  "ALBERCA 1":"Albercas", "AQUA PARK":"Albercas",
  "GYM-SPA":"Spa / Gym", "SPA-GYM":"Spa / Gym",
  "RESTAURANTE":"Restaurante",
  "EQUIPAMIENTO":"Equipamiento",
  "LAGOS":"Lagos",
};
function amenityBucket(sp){
  return AMENITY_BUCKET_MAP[(sp||"").trim().toUpperCase()] || "Otros amenidades";
}
// En "general" (Servicios Generales) se separan los servicios de infraestructura
// que Joseph pidió ver aparte: PTAR (planta de tratamiento, incluye tanto la obra
// directa como los movimientos de tierra hechos para ella), CFE y Solarmex.
function generalBucket(x){
  const sp = (x.sp||"").trim().toUpperCase();
  const b = (x.b||"").trim().toUpperCase();
  const co = (x.co||"").toUpperCase();
  if(sp==="PLANTA TRATAMIENTO") return "PTAR";
  if(sp==="ACCESOS") return "Accesos";
  if(b.includes("CFE")) return "CFE";
  if(b.includes("SOLARMEX") || b.includes("JOLVYZ")) return "Solarmex";
  if(co.includes("REDES GENERALES") || co.includes("MEDIA TENSION") || co.includes("MEDIA TENSIÓN")) return "Redes Generales";
  return "Otros servicios generales";
}
function drillGroupKey(catKey, x){
  if(catKey==="amenidades") return amenityBucket(x.sp);
  if(catKey==="general") return generalBucket(x);
  return x.op || "(sin partida)";
}
function drillBreakdown(catKey){
  const acc = {};
  PAGOS_ITEMS.filter(x=>x.cat===catKey).forEach(x=>{
    const key = drillGroupKey(catKey, x);
    if(!acc[key]) acc[key] = {n:key, s:0, c:0};
    acc[key].s += x.im; acc[key].c += 1;
  });
  return Object.values(acc).sort((a,b)=>b.s-a.s);
}

/* ---- Revisión Semanal ---- */
function mondayOf(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay();
  const diff = (day===0?-6:1-day);
  d.setDate(d.getDate()+diff);
  return d;
}
function weekKeyOf(dateStr){
  const m = mondayOf(dateStr);
  return m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(m.getDate()).padStart(2,"0");
}
function weekLabel(mondayKey){
  const start = new Date(mondayKey+"T00:00:00");
  const end = new Date(start); end.setDate(end.getDate()+6);
  const f = d => `${d.getDate()} ${MESES_CORTOS[d.getMonth()]}`;
  return `${f(start)} – ${f(end)} ${end.getFullYear()}`;
}
function isoWeekNum(mondayKey){
  const d = new Date(mondayKey+"T00:00:00");
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const yearStart = new Date(d.getFullYear(),0,1);
  return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}
function weekLabelCorto(mondayKey){
  const d = new Date(mondayKey+"T00:00:00");
  return d.getDate()+" "+MESES_CORTOS[d.getMonth()];
}
function monthKeyOf(dateStr){ return dateStr.slice(0,7); }
function monthLabel(key){ const [y,m]=key.split("-"); const n=MESES_CORTOS[+m-1]; return n.charAt(0).toUpperCase()+n.slice(1)+" "+y; }
function monthLabelCorto(key){ const [y,m]=key.split("-"); return MESES_CORTOS[+m-1]+" "+y.slice(2); }
const TRIM_MESES = ["Ene–Mar","Abr–Jun","Jul–Sep","Oct–Dic"];
function quarterKeyOf(dateStr){ const [y,m]=dateStr.split("-"); return y+"-T"+Math.ceil(+m/3); }
function quarterLabel(key){ const [y,q]=key.split("-T"); return `T${q} ${y} (${TRIM_MESES[+q-1]})`; }
function quarterLabelCorto(key){ const [y,q]=key.split("-T"); return "T"+q+" "+y.slice(2); }
// Códigos de semana del maestro de pagos (ej. "30E" = semana 30, año 2026; "13" sin
// letra = 2021). La letra marca el año (A=2022...E=2026...), el número la semana --
// por eso NO se pueden ordenar como texto ("9E" > "10E" alfabéticamente).
function semCodeParts(code){
  const m = /^(\d+)([A-Z]?)$/.exec(code||"");
  if(!m) return ["~", 0];
  return [m[2]||"", +m[1]];
}
function semCodeCompare(a,b){
  const [la,na] = semCodeParts(a), [lb,nb] = semCodeParts(b);
  return la!==lb ? (la<lb?-1:1) : na-nb;
}
const PERIODOS = {
  semana:    {keyOf:x=>x.sem,             label:c=>"Semana "+c, labelCorto:c=>c,          nombre:"semana",    nombrePlural:"semanas",    ventanaN:26, promedioN:8, tipPrefix:"", compare:semCodeCompare},
  mes:       {keyOf:x=>monthKeyOf(x.f),   label:monthLabel,   labelCorto:monthLabelCorto,   nombre:"mes",       nombrePlural:"meses",       ventanaN:18, promedioN:6, tipPrefix:""},
  trimestre: {keyOf:x=>quarterKeyOf(x.f), label:quarterLabel, labelCorto:quarterLabelCorto, nombre:"trimestre", nombrePlural:"trimestres",  ventanaN:12, promedioN:4, tipPrefix:""},
};
function periodosCombinados(items, cfg, ultimosN){
  const acc = {};
  items.forEach(x=>{ const k=cfg.keyOf(x); acc[k]=(acc[k]||0)+x.im; });
  let keys = Object.keys(acc).sort(cfg.compare);
  if(ultimosN) keys = keys.slice(-ultimosN);
  return keys.map(k=>[k, cfg.labelCorto(k), acc[k]/1e6]);
}
function roundedTopBarPath(x, y, w, h, r){
  r = Math.min(r, w/2, Math.max(h,0));
  if(h<=0) return "";
  if(r<=0.5) return `M${x},${y+h} L${x},${y} L${x+w},${y} L${x+w},${y+h} Z`;
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}
function svgPagosSemanal(data, selectedKey, cfg, avgValue, w=900, h=260){
  const pad={l:44,r:14,t:28,b:28};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max = Math.max(...data.map(d=>d[2]), avgValue||0, 1)*1.18;
  const n=data.length, colW=iw/n, barW=Math.max(Math.min(colW*0.62, 22), 3);
  const y=v=> pad.t + ih - (ih*v/max);
  const base = y(0);
  const grid=[0,0.5,1].map(f=>{const v=max*f; return `<line class="grid-line" x1="${pad.l}" x2="${w-pad.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="axis-label" x="${pad.l-8}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${v.toFixed(0)}M</text>`;}).join("");
  const baseline = `<line x1="${pad.l}" x2="${w-pad.r}" y1="${base.toFixed(1)}" y2="${base.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1"/>`;
  const avgLine = avgValue ? `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(avgValue).toFixed(1)}" y2="${y(avgValue).toFixed(1)}" stroke="var(--ink-400)" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/><text class="axis-label" x="${w-pad.r}" y="${(y(avgValue)-5).toFixed(1)}" text-anchor="end" opacity="0.85">promedio</text>` : "";
  let bars="", labels="", valueLabel="";
  data.forEach((d,i)=>{
    const [key,label,val] = d;
    const cx = pad.l + colW*i + colW/2;
    const tip = `<b>${cfg.tipPrefix}${cfg.label(key)}</b>${fmtMXN(val*1e6,true)}`;
    const isSel = key===selectedKey;
    const bx = cx-barW/2, by = y(val), bh = Math.max(base-by, 0);
    const fill = isSel ? "url(#barSel)" : "url(#barPlan)";
    bars += `<path data-tip="${tip}" data-weekkey="${key}" class="week-bar${isSel?" is-sel":""}" d="${roundedTopBarPath(bx, by, barW, bh, 4)}" fill="${fill}" style="cursor:pointer;"/>`;
    if(isSel && val>0){
      valueLabel = `<text x="${cx}" y="${(by-9).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent-ink)">${fmtMXN(val*1e6,true)}</text>`;
    }
    if(i%Math.ceil(n/16||1)===0 || i===n-1 || isSel) labels += `<text class="axis-label" x="${cx}" y="${h-8}" text-anchor="middle" ${isSel?'font-weight="600" fill="var(--accent-ink)"':''}>${label}</text>`;
  });
  const defs = `<defs>
    <linearGradient id="barSel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)"/>
      <stop offset="100%" stop-color="var(--accent-ink)"/>
    </linearGradient>
    <linearGradient id="barPlan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--plan)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="var(--plan)" stop-opacity="0.55"/>
    </linearGradient>
  </defs>`;
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-pro">${defs}${grid}${baseline}${avgLine}${bars}${valueLabel}${labels}</svg>`;
}

function pageControlObraSeccionSemanal(){

  // confirmados (no se calculan de la fecha actual), así que no forzamos uno.
  const todayKey = periodoGranularidad==="semana" ? null : cfg.keyOf({f:todayISO});

  const itemsThis = items.filter(x=>cfg.keyOf(x)===sel);

  const ptAgg = {}; itemsThis.forEach(x=>{ const k=currentScope==="amenidades"?amenityBucket(x.sp):(x.sp||"(sin partida)"); ptAgg[k]=(ptAgg[k]||0)+x.im; });

  ${switcher}

  <div class="card" style="margin-bottom:24px;">
    <div class="card-head"><h3>${cfg.nombre.charAt(0).toUpperCase()+cfg.nombre.slice(1)}</h3><span class="hint">${periods.length} ${cfg.nombrePlural} con actividad</span></div>
    ${periodoGranularidad==="semana" ? (()=>{ const rep = items.find(x=>x.sem===sel); return `<div style="font-weight:800;font-size:22px;line-height:1.2;margin-bottom:12px;color:var(--accent-ink);">Semana ${sel}${rep?` <span class="hint" style="font-weight:400;font-size:14px;">· pagado ${fmtFecha(rep.f)}</span>`:""}</div>`; })() : ""}
    <select id="semInput" class="qb-input" style="width:auto;min-width:260px;">
      ${periods.map(w=>`<option value="${w}" ${w===sel?"selected":""}>${cfg.label(w)}${w===todayKey?" · actual":""}</option>`).join("")}
    </select>
  </div>

  <div class="card" style="margin-bottom:24px;">
    <div class="card-head"><h3>Historial de pagos por ${cfg.nombre}</h3><span class="hint">Millones MXN · últimos ${cfg.ventanaN} ${cfg.nombrePlural} · clic en una barra para verla</span></div>
    <div class="chart-box">${svgPagosSemanal(periodosCombinados(items,cfg,cfg.ventanaN), sel, cfg, avgN?avgN/1e6:null)}</div>
  </div>

  <div class="grid grid-kpi" style="margin-bottom:24px;">
    <div class="card kpi-card hero">
      <span class="label">Pagado este ${cfg.nombre}</span>
      <span class="value">${fmtMXN(totalThis,true)}</span>
      <span class="foot">${itemsThis.length} pagos</span>
    </div>
    <div class="card kpi-card">
      <span class="label">Vs. ${cfg.nombre} anterior</span>
      <span class="value" style="font-size:22px;${deltaPct===null?"":deltaPct>=0?"color:var(--critical);":"color:#0a7a0a;"}">${deltaPct===null?"—":(deltaPct>=0?"+":"")+deltaPct.toFixed(0)+"%"}</span>
      <span class="foot">${prevPeriod ? cfg.label(prevPeriod)+": "+fmtMXN(totalPrev,true) : "Sin "+cfg.nombre+" previo"}</span>
    </div>
    <div class="card kpi-card">
      <span class="label">Promedio últimos ${cfg.promedioN} ${cfg.nombrePlural}</span>
      <span class="value" style="font-size:22px;">${avgN===null?"—":fmtMXN(avgN,true)}</span>
      <span class="foot">${avgN===null?"":(totalThis>avgN?"Por encima del promedio":"Por debajo del promedio")}</span>
    </div>
  </div>

  <div class="card" style="margin-bottom:24px;">
    <div class="card-head"><h3>Todos los pagos de est${cfg.nombre==="semana"?"a":"e"} ${cfg.nombre}</h3><span class="hint">${itemsThis.length} pago${itemsThis.length===1?"":"s"}</span></div>
    <div class="qb-breakdown">
      ${itemsThis.length ? itemsThis.slice().sort((a,b)=>b.im-a.im).map(x=>`

      <div class="qb-breakdown">
        ${mayores.length ? mayores.map(x=>`
          <div class="qb-row">
            <div><div class="qb-cat">${x.b}</div><div class="qb-items">${x.co}</div></div>
            <div class="qb-nums tabular"><b>${fmtMXN(x.im,true)}</b></div>

    <div class="card">

      <div class="qb-breakdown">
        ${provsNuevos.length ? provsNuevos.map(p=>`

      <div class="qb-breakdown">
        ${topProv.map(([n,s])=>`

// Barras "bala": pista completa = contratado (a escala del mayor contratado del
// grupo), relleno = pagado. Una fila por partida, ordenadas por contratado.
function svgPresupuestoVsReal(rows, w=900, labelC="Contratado", labelP="Pagado"){
  const rowH = 34, gap = 10, padL = 4, padR = 90, labelW = 260;
  const trackW = w - labelW - padR - padL;
  const max = Math.max(...rows.map(r=>r.c), 1);
  const h = rows.length * (rowH+gap) + gap;
  let bars = "";
  rows.forEach((r,i)=>{
    const y = gap + i*(rowH+gap);
    const tw = Math.max((r.c/max)*trackW, 2);
    const pw = Math.max((Math.min(r.p,r.c)/max)*trackW, r.p>0?2:0);
    const overshoot = r.p > r.c;
    const pct = r.c>0 ? 100*r.p/r.c : 0;
    const tip = `<b>${r.n}</b>${labelC}: ${fmtMXN(r.c,true)}<br>${labelP}: ${fmtMXN(r.p,true)} (${pct.toFixed(0)}%)`;
    bars += `<text class="axis-label" x="${labelW-10}" y="${y+rowH/2+4}" text-anchor="end" font-size="11.5">${r.n.length>34?r.n.slice(0,33)+"…":r.n}</text>`;
    bars += `<g data-tip='${tip}'>`;
    bars += `<path d="${roundedTopBarPath(labelW, y, tw, rowH, 6)}" fill="var(--page)" stroke="var(--line-strong)" stroke-width="1"/>`;
    if(pw>0) bars += `<path d="${roundedTopBarPath(labelW, y, pw, rowH, 6)}" fill="${overshoot?"var(--critical)":"url(#barSel)"}"/>`;
    bars += `<rect x="${labelW}" y="${y}" width="${tw}" height="${rowH}" fill="transparent"/>`;
    bars += `</g>`;
    bars += `<text class="axis-label" x="${labelW+tw+8}" y="${y+rowH/2+4}" font-size="11.5" font-weight="600" fill="${overshoot?"var(--critical)":"var(--accent-ink)"}">${fmtPct(pct)}</text>`;
  });
  const defs = `<defs><linearGradient id="barSel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent-ink)"/></linearGradient></defs>`;
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-pro" style="width:100%;height:auto;">${defs}${bars}</svg>`;
}

/* ---- Clientes por torre y módulo (a partir de comisiones por depto) ---- */
function moduloDe(depto){
  const m = depto.match(/^[A-Z]*\d+([AB])/);
  return m ? m[1] : "?";
}
function clientesPorTorreModulo(){
  const grupos = {t1:{}, t2:{}, t3:{}};
  COMISIONES_POR_DEPTO.unidades.forEach(u=>{
    if(!grupos[u.torre]) return;
    const mod = moduloDe(u.depto);
    if(!grupos[u.torre][mod]) grupos[u.torre][mod] = [];
    grupos[u.torre][mod].push(u);
  });
  Object.values(grupos).forEach(byMod=>Object.keys(byMod).forEach(mod=>{
    byMod[mod].sort((a,b)=>(parseInt(a.depto.replace(/\D/g,""))||0)-(parseInt(b.depto.replace(/\D/g,""))||0));
  }));
  return grupos;
}
let clFiltro = "";
function clSortOptionsHtml(){
  const current = getSort("cl", "depto");
  const opts = [["depto","Depto (orden natural)"],["monto_desc","Monto ↓ Mayor a menor"],["monto_asc","Monto ↑ Menor a mayor"]];
  return `<select class="sort-select" data-sortid="cl">
    ${opts.map(([v,l])=>`<option value="${v}" ${v===current?"selected":""}>${l}</option>`).join("")}
  </select>`;
}
function renderClientesLista(){
  const el = document.getElementById("clResults");
  if(!el) return;
  const grupos = clientesPorTorreModulo();
  const torreLbl = {t1:"Torre 1", t2:"Torre 2", t3:"Torre 3"};
  const matches = u => !clFiltro || normTxt(u.depto+" "+u.comprador+" modulo "+moduloDe(u.depto)).includes(normTxt(clFiltro));
  const sortMode = getSort("cl", "depto");
  const sortList = list => {
    if(sortMode==="monto_desc") return [...list].sort((a,b)=>b.precio-a.precio);
    if(sortMode==="monto_asc") return [...list].sort((a,b)=>a.precio-b.precio);
    return list; // ya viene ordenado por depto (orden natural)
  };
  let html = `<div class="qb-toolbar" style="margin-top:0;margin-bottom:4px;">${clSortOptionsHtml()}</div>`;
  let anyMatch = false;
  ["t1","t2","t3"].forEach(t=>{
    const mods = Object.keys(grupos[t]).sort();
    const filteredMods = mods.map(m=>({m, list: sortList(grupos[t][m].filter(matches))})).filter(g=>g.list.length);
    if(!filteredMods.length) return;
    anyMatch = true;
    const totalUnidades = filteredMods.reduce((s,g)=>s+g.list.length,0);
    html += `<div class="card-head" style="padding:0 4px;margin-top:18px;"><h3 style="font-size:15px;">${torreLbl[t]}</h3><span class="hint">${totalUnidades} unidad${totalUnidades===1?"":"es"}</span></div>
    <div class="grid grid-2" style="margin-top:10px;">
      ${filteredMods.map(g=>`
        <div class="card" style="box-shadow:none;background:var(--page);">
          <div class="card-head"><h3 style="font-size:13px;">Módulo ${g.m}</h3><span class="hint">${g.list.length}</span></div>
          <div class="qb-breakdown">
            ${g.list.map(u=>`
              <div class="qb-row">
                <div><div class="qb-cat">${u.depto}</div><div class="qb-items">${u.comprador}</div></div>
                <div class="qb-nums tabular">${fmtMXN(u.precio,true)}</div>
              </div>`).join("")}
          </div>
        </div>`).join("")}
    </div>`;
  });
  el.innerHTML = html + (anyMatch ? "" : `<p class="foot" style="margin-top:12px;">Sin coincidencias.</p>`);
  const sel = el.querySelector('[data-sortid="cl"]');
  if(sel) sel.addEventListener("change", ()=>{ setSort("cl", sel.value); renderClientesLista(); });
}

function inventarioResumenTorre(t){

  units.forEach(u=>{ if(c[u.s]!==undefined) c[u.s]++; });
  const total = units.length;
  const colocado = c.vendido+c.apartado+c.reservado;
  return {total, ...c, colocado, pct: total ? 100*colocado/total : 0};
}

/* ============================================================ CORTE INTERACTIVO TORRE 1 ============================================================
   Geometría propia (no depende de medir píxeles de ninguna imagen específica): viewBox fijo 0-1000 x 0-1000,
   23 "unidades de fila" (SG=1, PH=2 dúplex, 18 pisos típicos=18, GH=2 dúplex), dos módulos de 4 deptos con
   una franja central angosta entre ellos, y el lobby de GH llegando al centro de las unidades 02 y 03. */
let DEBUG_APARTMENT_ZONES = false;
let corteSelDepto = null;
const T1_IMG_W = 1000, T1_IMG_H = 1000;
const T1_CORTE_IMG_VER = 2;
// Bounding box del edificio medido directamente en assets/torre1_corte.png (v2): la foto NO llega
// borde a borde -- tiene margen de cielo a los lados y arriba. Estos valores están calibrados a esa
// imagen específica; si se reemplaza la foto, hay que volver a medir y actualizar estos 4 números.
const T1_GEOM = {
  buildingLeft: 68.4, buildingRight: 927.7,
  // top/bottom: medidos directamente en assets/torre1_corte.png (px 33 y ~1441 de 1536, con un
  // ajuste fino de +7.8 hacia abajo tras comparar contra capturas reales del hover en pantalla).
  // El bottom NO es el borde inferior de la imagen -- de ahí para abajo son palmeras/jardín, no piso.
  buildingTop: 29.3, buildingBottom: 946.4,
  moduloBRight: 493.0, moduloARight_left: 503.0, // franja central angosta entre módulos
};
const T1_ROW_UNIT = (T1_GEOM.buildingBottom - T1_GEOM.buildingTop) / 23;
function t1FloorBand(pisoKey){
  const top = T1_GEOM.buildingTop;
  if(pisoKey==="RG") return {y0:top, y1:top+T1_ROW_UNIT};
  if(pisoKey==="PH") return {y0:top+T1_ROW_UNIT, y1:top+T1_ROW_UNIT*3};
  if(pisoKey==="GH") return {y0:top+T1_ROW_UNIT*21, y1:top+T1_ROW_UNIT*23};
  const n = parseInt(pisoKey,10); // 18..1
  const y0 = top + T1_ROW_UNIT*3 + (18-n)*T1_ROW_UNIT;
  return {y0, y1:y0+T1_ROW_UNIT};
}
function t1PisoKey(u){
  if(u.p==="20") return "RG";
  if(u.p==="19") return "PH";
  if(u.p==="PB") return "GH";
  return u.p;
}
function t1ModuloX(md){
  return md==="B" ? {x0:T1_GEOM.buildingLeft, x1:T1_GEOM.moduloBRight} : {x0:T1_GEOM.moduloARight_left, x1:T1_GEOM.buildingRight};
}
// Agrupa las unidades reales de Torre 1 por piso+módulo, en el orden original (izq. a der.), y calcula el rectángulo de cada una.
// Las unidades combinadas 05/06 (m² grande) ocupan 2 espacios. En GH, el lobby es su propio espacio no-clickeable
// que llega hasta el centro de las unidades 02 y 03 (GH01 y GH04 completos a los lados).
function t1BuildRects(){
  const byGroup = {};
  const order = [];
  INVENTARIO_REAL.filter(u=>u.t==="t1").forEach(u=>{
    const piso = t1PisoKey(u);
    const key = piso+"|"+u.md;
    if(!byGroup[key]){ byGroup[key]=[]; order.push(key); }
    byGroup[key].push(u);
  });
  const rects = [];
  order.forEach(key=>{
    const [piso, md] = key.split("|");
    const units = byGroup[key];
    const band = t1FloorBand(piso);
    const xr = t1ModuloX(md);
    const moduleW = xr.x1-xr.x0;
    if(piso==="GH" && units.length===4){
      // Las 4 unidades se dimensionan por su m² real (GH02/GH03 son ~15% más angostas que GH01/GH04, no la mitad).
      // El lobby es espacio ADICIONAL insertado entre la 2 y la 3, no restado de esas unidades.
      const lobbyW = moduleW * 0.18;
      const unitsW = moduleW - lobbyW;
      const m2w = units.map(u=>parseFloat(u.m2)||1);
      const totalM2 = m2w.reduce((a,b)=>a+b,0);
      const segW = m2w.map(m=>unitsW*(m/totalM2));
      let cursor = xr.x0;
      rects.push({u:units[0], x:cursor, y:band.y0, w:segW[0], h:band.y1-band.y0, piso, md}); cursor+=segW[0];
      rects.push({u:units[1], x:cursor, y:band.y0, w:segW[1], h:band.y1-band.y0, piso, md}); cursor+=segW[1];
      cursor += lobbyW; // lobby, no clickeable
      rects.push({u:units[2], x:cursor, y:band.y0, w:segW[2], h:band.y1-band.y0, piso, md}); cursor+=segW[2];
      rects.push({u:units[3], x:cursor, y:band.y0, w:segW[3], h:band.y1-band.y0, piso, md});
      return;
    }
    const weights = units.map(u=>{
      const m2 = parseFloat(u.m2)||0;
      return m2>=140 ? 2 : 1;
    });
    const totalW = weights.reduce((a,b)=>a+b,0) || units.length;
    let cursor = xr.x0;
    units.forEach((u,i)=>{
      const w = moduleW * (weights[i]/totalW);
      rects.push({u, x:cursor, y:band.y0, w, h:band.y1-band.y0, piso, md});
      cursor += w;
    });
  });
  return rects;
}
const T1_STATUS_STYLE = {

  disponible: {fill:"rgba(120,120,120,0.0)",hatch:"t1hatchDisp",    stroke:"#5f5e5a"},
  apartado:   {fill:"rgba(186,117,23,0.0)", hatch:"t1hatchApart",   stroke:"#854f0b"},

// Cruza una unidad de INVENTARIO_REAL con su registro de cobranza real en VENTAS_REAL
// (fuente: ventas/vtas palm agosto 2026.xlsx). Los códigos de unidad no son idénticos entre
// ambas fuentes (GH01->G01, PH1->"PH 1 (1901)"), de ahí el mapeo por piso.
function t1FindVenta(u){
  if(u.t!=="t1" || u.p==="20") return null; // RG (suite garden) no tiene registro de venta propio
  if(u.p==="19"){
    const n = u.u.replace("PH","");
    return VENTAS_REAL.find(v=>v.t===u.t && v.md===u.md && v.niv==="19" && v.u.startsWith(`PH ${n} `));
  }
  if(u.p==="PB"){
    const n = "G"+u.u.replace("GH","");
    return VENTAS_REAL.find(v=>v.t===u.t && v.md===u.md && v.niv==="PB - 1" && v.u===n);
  }
  return VENTAS_REAL.find(v=>v.t===u.t && v.md===u.md && v.niv===u.p && v.u===u.u);
}

    </div>
    ${venta ? `

// Cobranza real por cliente/unidad -- fuente: ventas/vtas palm agosto 2026.xlsx
// (autoritativo: precio de venta, pagado a la fecha y saldo por depto), a
// diferencia de "Clientes por torre y módulo" en Resumen que se arma inferido
// del concepto de las comisiones pagadas.
function cobranzaResumenTorre(t){
  const us = VENTAS_REAL.filter(u=>u.t===t);
  const contrato = us.filter(u=>u.s==="Contrato");
  return {
    contratado: contrato.reduce((s,u)=>s+u.pv,0),
    cobrado: contrato.reduce((s,u)=>s+u.pc,0),
    saldo: contrato.reduce((s,u)=>s+u.sd,0),
    unidadesContrato: contrato.length,
    unidadesTotal: us.length,
  };
}
let cobFiltro = "";
function renderCobranzaResultados(query){
  const el = document.getElementById("cobResults");
  if(!el) return;
  const norm = normTxt(query);
  const terms = stripStopwords(norm.split(/\s+/).filter(Boolean));
  const contrato = VENTAS_REAL.filter(u=>u.s==="Contrato" && enScope(u.t));
  const filtered = terms.length ? contrato.filter(u=>{
    const hay = normTxt([u.cli,u.u,u.t,u.md,u.ase].filter(Boolean).join(" "));
    return terms.every(t=>hay.includes(t));
  }) : contrato;
  const rows = [...filtered].sort((a,b)=>b.sd-a.sd).slice(0,30);
  el.innerHTML = rows.length ? rows.map(u=>{
    const pct = u.pv>0 ? 100*u.pc/u.pv : 0;
    return `<div class="qb-row">
      <div><div class="qb-cat">${u.cli||"(sin nombre)"}</div><div class="qb-items">${(u.t||"").toUpperCase()}${u.md||""} · depto ${u.u} · ${fmtPct(pct)} cobrado</div></div>
      <div class="qb-nums tabular"><b>${fmtMXN(u.pv,true)}</b><br><span class="foot">saldo ${fmtMXN(u.sd,true)}</span></div>
    </div>`;
  }).join("") : `<p class="foot" style="margin-top:12px;">Sin coincidencias para "${query}".</p>`;
  const hint = document.getElementById("cobHint");
  if(hint) hint.textContent = query ? `${filtered.length} resultado${filtered.length===1?"":"s"}` : `${contrato.length} unidades en contrato`;
}
